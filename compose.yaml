
services:
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # You should definitely change the password in production
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
###< doctrine/doctrine-bundle ###


###>redis ###
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
###<redis ###

###>mailer ###
  mailer:
    image: axllent/mailpit
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
###<mailer ###

###>lgtm - Loki + Prometheus + Otel Collector
  lgtm:
    image: grafana/otel-lgtm
    ports: [ "127.0.0.1:3000:3000", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318" ]

  chaos:
    image: php:8.5-cli-alpine
    working_dir: /app
    environment:
      PHP_CLI_SERVER_WORKERS: "8"    # /slow must not block other requests
    command: [ "php", "-S", "0.0.0.0:8090", "router.php" ]
    volumes: [ "./docker/chaos:/app:ro" ]
    ports: [ "127.0.0.1:8090:8090" ]
###<lgtm - Loki + Prometheus + Otel Collector

###>rabbitmq - RabbitMQ
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["broker"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports: [ "127.0.0.1:5672:5672", "127.0.0.1:15672:15672" ]
###<rabbitmq

###>seaweedfs
  seaweedfs:
    image: chrislusf/seaweedfs
    profiles: ["s3"]
    command: "server -s3 -dir=/data"
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["s3_data:/data"]
###<seaweedfs

volumes:
  db_data:
  s3_data:
