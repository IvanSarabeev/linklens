when@dev:
    monolog:
        handlers:
            app_file:
                type: rotating_file
                path: '%kernel.logs_dir%/app.json.log'
                level: info
                max_files: 14
                formatter: monolog.formatter.json
            errors_file:
                type: rotating_file
                path: '%kernel.logs_dir%/errors.json.log'
                level: error
                max_files: 30
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']
