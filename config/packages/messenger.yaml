framework:
    messenger:
        failure_transport: failed
        buses:
            messenger.bus.default:
                middleware:
                    - App\Infrastructure\Observability\TracingMiddleware
                    - doctrine_ping_connection
                    - doctrine_close_connection
        transports:
            async_high:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { queue_name: high }
                retry_strategy: { max_retries: 3, delay: 1000, multiplier: 2 }
            async_enrich:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { queue_name: enrich }
                retry_strategy: { max_retries: 3, delay: 2000, multiplier: 3, max_delay: 60000 }
            async_export:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { queue_name: export }
                retry_strategy: { max_retries: 3, delay: 5000, multiplier: 2, max_delay: 60000 }
            async_low:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { queue_name: low }
                retry_strategy: { max_retries: 5, delay: 10000, multiplier: 2 }
            async_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { queue_name: events }
            failed: 'doctrine://default?queue_name=failed'

when@test:
    framework:
        messenger:
            transports:
                async_high: 'test://'
                async_enrich: 'test://'
                async_export: 'test://'
                async_low: 'test://'
                async_events: 'test://'
