flysystem:
    storages:
        imports.storage:
            adapter: 'local'
            options: { directory: '%kernel.project_dir%/var/storage/imports' }
        exports.storage:
            adapter: 'local'
            options: { directory: '%kernel.project_dir%/var/storage/exports' }

when@test:
    flysystem:
        storages:
            imports.storage: { adapter: 'memory' }
            exports.storage: { adapter: 'memory' }
