# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        autowire: true      # Automatically injects dependencies in your services.

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/*/Model/'
            - '../src/Domain/*/Exception/'
            - '../src/Kernel.php'

    OpenTelemetry\SDK\Trace\SpanExporterInterface:
        factory: [ '@App\Infrastructure\Observability\TelemetryFactory', 'spanExporter' ]
    OpenTelemetry\SDK\Logs\LogRecordExporterInterface:
        factory: [ '@App\Infrastructure\Observability\TelemetryFactory', 'logExporter' ]
    OpenTelemetry\SDK\Trace\TracerProviderInterface:
        factory: [ '@App\Infrastructure\Observability\TelemetryFactory', 'tracerProvider' ]
    OpenTelemetry\SDK\Logs\LoggerProviderInterface:
        factory: [ '@App\Infrastructure\Observability\TelemetryFactory', 'loggerProvider' ]
    OpenTelemetry\API\Trace\TracerInterface:
        factory: [ '@OpenTelemetry\SDK\Trace\TracerProviderInterface', 'getTracer' ]
        arguments: [ 'linklens' ]
    OpenTelemetry\Contrib\Logs\Monolog\Handler:
        arguments: [ '@OpenTelemetry\SDK\Logs\LoggerProviderInterface', 'info' ]
